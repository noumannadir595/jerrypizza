name: jerrypizza
description: "Jerry Pizza - Food Ordering App"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ==================== FIREBASE ====================
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.1.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

  # ==================== STATE & NAVIGATION ====================
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0

  # ==================== UI ====================
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # ==================== STORAGE ====================
  shared_preferences: ^2.3.3

  # ==================== MAPS & LOCATION ====================
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1
  geocoding: ^3.0.0

  # ==================== ANIMATION & NETWORK ====================
  flutter_animate: ^4.5.2
  connectivity_plus: ^6.1.0

  # ==================== UTILS ====================
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # ==================== SPLASH & ICONS ====================
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# ==================== OVERRIDES ====================
dependency_overrides:
  win32: ^5.5.3
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ==================== FLUTTER ====================
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/categories/
    - assets/images/best_pizza/
    - assets/images/regular_pizza/
    - assets/images/burger/
    - assets/images/wings_nuggets/
    - assets/images/wraps/
    - assets/images/fries/
    - assets/images/pasta/
    - assets/images/sandwich/
    - assets/images/new_arrival/
    - assets/images/drinks/
    - assets/images/deals/
    - assets/images/desi/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# ==================== LAUNCHER ICONS ====================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#E63946"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

# ==================== NATIVE SPLASH ====================
flutter_native_splash:
  color: "#E63946"
  image: assets/images/logo.png
  android: true
  ios: true
  android_12:
    color: "#E63946"
    image: assets/images/logo.png
    icon_background_color: "#E63946"